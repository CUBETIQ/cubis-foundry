id: qa
kind: compat-alias
label: QA
description: "Compatibility wrapper for broad QA requests. Route browser work to web-testing, native mobile work to android-emulator-testing or ios-simulator-testing, and code-level testing to the owning language or framework skill."
stability: stable
profiles: []
dependencies: []
capability:
  type: tool
  domains:
    - quality
    - testing
  outputs:
    - type: skill
      path: foundry/modules/qa/SKILL.md
      platforms: [claude, codex, copilot, gemini, antigravity]
