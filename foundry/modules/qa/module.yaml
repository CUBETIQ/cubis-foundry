id: qa
kind: capability
label: QA
description: "Comprehensive QA capability covering general acceptance testing, Playwright-driven browser QA, and mobile QA planning. Use when running quality assurance tests, building test infrastructure, or performing release-readiness verification."
stability: stable
profiles:
  - core
  - developer
dependencies: []
capability:
  type: tool
  domains:
    - quality
    - testing
  outputs:
    - type: skill
      path: foundry/modules/qa/SKILL.md
      mode: ui-harness
      platforms: [claude, codex, copilot, gemini, antigravity]
    - type: skill
      path: foundry/modules/playwright-interactive/SKILL.md
      mode: playwright-web
      platforms: [claude, codex, copilot, gemini, antigravity]
    - type: skill
      path: foundry/modules/qa/SKILL.md
      mode: flutter-mobile
      platforms: [claude, codex, copilot, gemini, antigravity]
