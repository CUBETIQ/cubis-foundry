platform: copilot
label: GitHub Copilot

rules:
  mergeStrategy: layered
  userOverride: honor
  conflictResolution: user-first
  generate:
    type: markdown-merge
    source: foundry/modules/rules-core/rules
    output: .github/copilot-instructions.md

skills:
  projection:
    type: markdown-transform
    transforms:
      - match: "**/SKILL.md"
        pipeline:
          - filter: frontmatter
          - normalize: markdown
  capabilityProjection: []

workflows:
  projection:
    - format: copilot-prompt-markdown
      outputPattern: .github/prompts/{id}.prompt.md

specialists:
  projection:
    - format: copilot-agent-markdown
      outputPattern: .github/agents/{id}.agent.md

agents:
  projection:
    - format: copilot-agent-markdown
      outputPattern: .github/agents/{id}.agent.md

hooks:
  projection:
    - format: hooks-bundle
      outputDir: .github/hooks

contextDocs:
  enabled: true
  outputDir: docs/foundation
  managedSections: true
  markers:
    prefix: "<!-- cbx:"
    suffix: "-->"
  templates:
    - id: tech-md
      source: foundry/modules/contexts-core/templates/tech.md.j2
      output: docs/foundation/TECH.md
      triggers: [init, sync, build]
    - id: architecture-md
      source: foundry/modules/contexts-core/templates/architecture.md.j2
      output: docs/foundation/ARCHITECTURE.md
      triggers: [init, sync, build]
    - id: structure-md
      source: foundry/modules/contexts-core/templates/structure.md.j2
      output: docs/foundation/STRUCTURE.md
      triggers: [init, sync]
    - id: memory-md
      source: foundry/modules/contexts-core/templates/memory.md.j2
      output: docs/foundation/MEMORY.md
      triggers: [init, sync]
    - id: product-md
      source: foundry/modules/contexts-core/templates/product.md.j2
      output: docs/foundation/PRODUCT.md
      triggers: [init, sync]
