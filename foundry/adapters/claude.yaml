platform: claude
label: Claude Code

rules:
  mergeStrategy: layered
  userOverride: honor
  conflictResolution: user-first
  generate:
    type: skill-merge
    source: foundry/modules/rules-core/rules.yaml
    output: .claude/rules.d/rules.yaml

skills:
  projection:
    type: markdown-transform
    transforms:
      - match: "**/*.md"
        pipeline:
          - filter: code-blocks
          - map: frontmatter
          - merge: capability
  capabilityProjection:
    - capability: api-design
      output: foundry/modules/api-design/SKILL.md
      template: foundry/modules/api-design/templates/claude.j2
    - capability: fastapi
      output: foundry/modules/fastapi/SKILL.md
      template: foundry/modules/fastapi/templates/claude.j2
    - capability: typescript-best-practices
      output: foundry/modules/typescript-best-practices/SKILL.md
      template: foundry/modules/typescript-best-practices/templates/claude.j2
    - capability: frontend-design
      output: foundry/modules/frontend-design/SKILL.md
      template: foundry/modules/frontend-design/templates/claude.j2
    - capability: code-review
      output: foundry/modules/code-review/SKILL.md
      template: foundry/modules/code-review/templates/claude.j2

workflows:
  projection: []

specialists:
  projection: []

contextDocs:
  enabled: true
  outputDir: docs/foundation
  managedSections: true
  markers:
    prefix: "<!-- cbx:"
    suffix: "-->"
  templates:
    - id: tech-md
      source: foundry/modules/contexts-core/templates/tech.md.j2
      output: docs/foundation/TECH.md
      triggers: [init, sync, build]
    - id: architecture-md
      source: foundry/modules/contexts-core/templates/architecture.md.j2
      output: docs/foundation/ARCHITECTURE.md
      triggers: [init, sync, build]
    - id: structure-md
      source: foundry/modules/contexts-core/templates/structure.md.j2
      output: docs/foundation/STRUCTURE.md
      triggers: [init, sync]
    - id: memory-md
      source: foundry/modules/contexts-core/templates/memory.md.j2
      output: docs/foundation/MEMORY.md
      triggers: [init, sync]
    - id: product-md
      source: foundry/modules/contexts-core/templates/product.md.j2
      output: docs/foundation/PRODUCT.md
      triggers: [init, sync]
    - id: api-design-skill
      source: foundry/modules/api-design/templates/claude.j2
      output: foundry/modules/api-design/SKILL.md
      triggers: [build]
    - id: fastapi-skill
      source: foundry/modules/fastapi/templates/claude.j2
      output: foundry/modules/fastapi/SKILL.md
      triggers: [build]
    - id: typescript-best-practices-skill
      source: foundry/modules/typescript-best-practices/templates/claude.j2
      output: foundry/modules/typescript-best-practices/SKILL.md
      triggers: [build]
    - id: frontend-design-skill
      source: foundry/modules/frontend-design/templates/claude.j2
      output: foundry/modules/frontend-design/SKILL.md
      triggers: [build]
    - id: code-review-skill
      source: foundry/modules/code-review/templates/claude.j2
      output: foundry/modules/code-review/SKILL.md
      triggers: [build]
