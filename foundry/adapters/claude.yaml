platform: claude
label: Claude Code

rules:
  mergeStrategy: layered
  userOverride: honor
  conflictResolution: user-first
  generate:
    type: skill-merge
    source: foundry/modules/rules-core/rules.yaml
    output: .claude/rules.d/rules.yaml

