description = "Research the relevant codebase surface and produce a structured implementation plan before writing code."
prompt = '''
Execute the native projection of the /plan workflow.

Research the relevant codebase surface and produce a structured implementation plan before writing code.

Execution contract:
1. Treat route selection as already resolved by this command; do not begin with skill discovery.
- native workflow surface: command.
- native specialist surface: agent-route command.
2. Load docs in this order when they exist: `docs/foundation/MEMORY.md` -> `docs/foundation/PRODUCT.md` -> `docs/foundation/ARCHITECTURE.md` -> `docs/foundation/STRUCTURE.md`. Add `docs/foundation/DESIGN.md` only for UI or design-heavy work, and `docs/foundation/TECH.md` only when execution details matter.
Attached skills:
- Load these exact skill IDs first: `spec-driven-delivery`, `system-design`, `deep-research`.
- Local skill file hints if installed: `.gemini/skills/spec-driven-delivery/SKILL.md`, `.gemini/skills/system-design/SKILL.md`, `.gemini/skills/deep-research/SKILL.md`.
- Treat the skill bundle as already resolved for this workflow. Do not start with route discovery.
3. Confirm the request fits the workflow's "When to use" section before acting.
4. Execute according to "Workflow steps" and apply "Context notes".
5. Complete "Verification" checks and report concrete evidence.
6. If freshness, public comparison, or explicit research needs appear, pause implementation and load `deep-research` or route to research first.
7. For outside evidence: repo first, official docs next, Reddit/community only as labeled secondary evidence.
8. Keep runtime boundaries explicit: use Playwright MCP for web flows, prefer `mobile-mcp` for semantic mobile flows, and switch to CLI fallback when you need deterministic logs, build state, or replayable evidence.

Workflow source:
# Plan Workflow

## What this workflow does

Explores the repository, identifies the affected surfaces, and turns the request into an execution-ready plan with acceptance checks.

## When to use

Use this for architecture changes, broad refactors, new features, or any task where implementation should not begin from guesswork.

## Agent chain

`explorer -> planner -> orchestrator`

## Step details

1. `explorer` maps the relevant code and docs.
2. `planner` turns the findings into ordered tasks with verification.
3. `orchestrator` reviews the plan, trims unnecessary work, and returns the route.

## Skill routing

- `spec-driven-delivery` for Git-backed task packs and traceability
- `system-design` for architectural trade-offs
- `deep-research` only when external evidence is required

## Context notes

Provide the goal, constraints, deadline pressure, and any files or plans that already exist.

## Verification

The result should include clear scope, ordered tasks, known risks, and explicit verification per task.

## Output contract

```yaml
PLAN_WORKFLOW_RESULT:
  summary: <goal and scope>
  tasks:
    - id: T1
      step: <task>
      verification: <check>
  risks:
    - <risk>
  next_route: /implement
```

## Follow-up items

Typical next step: `/implement`

If command arguments are provided, treat them as additional user context.
'''
