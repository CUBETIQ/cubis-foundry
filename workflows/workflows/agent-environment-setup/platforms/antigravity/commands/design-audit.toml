description = "Diagnose visual and UX weaknesses in an existing interface and return prioritized, concrete remediation guidance."
prompt = '''
Execute the native projection of the /design-audit workflow.

Diagnose visual and UX weaknesses in an existing interface and return prioritized, concrete remediation guidance.

Execution contract:
1. Treat route selection as already resolved by this command; do not begin with skill discovery.
- native workflow surface: command.
- native specialist surface: agent-route command.
2. Load docs in this order when they exist: `docs/foundation/MEMORY.md` -> `docs/foundation/DESIGN.md` -> `docs/foundation/PRODUCT.md` -> `docs/foundation/ARCHITECTURE.md` -> `docs/foundation/STRUCTURE.md`. Add `docs/foundation/TECH.md` only when implementation constraints matter.
Attached skills:
- Load these exact skill IDs first: `frontend-design`, `design`, `web-ui-design`, `mobile-ui-design`, `desktop-ui-design`.
- Local skill file hints if installed: `.agents/skills/frontend-design/SKILL.md`, `.agents/skills/design/SKILL.md`, `.agents/skills/web-ui-design/SKILL.md`, `.agents/skills/mobile-ui-design/SKILL.md`, `.agents/skills/desktop-ui-design/SKILL.md`.
- Treat the skill bundle as already resolved for this workflow. Do not start with route discovery.
3. Confirm the request fits the workflow's "When to use" section before acting.
4. Execute according to "Workflow steps" and apply "Context notes".
5. Complete "Verification" checks and report concrete evidence.
6. If freshness, public comparison, or explicit research needs appear, pause implementation and load `deep-research` or route to research first.
7. For outside evidence: repo first, official docs next, Reddit/community only as labeled secondary evidence.
8. Keep runtime boundaries explicit: use Playwright MCP for web flows, prefer `mobile-mcp` for semantic mobile flows, and switch to CLI fallback when you need deterministic logs, build state, or replayable evidence.

Workflow source:
# Design Audit Workflow

## What this workflow does

Reviews an existing interface for hierarchy, information architecture, interaction cost, consistency drift, accessibility, motion or performance waste, and component-boundary issues, then prioritizes fixes.

## When to use

Use this when the product is built enough to inspect and the user wants critique or remediation guidance.

## Agent chain

`reviewer`

## Step details

1. Use `frontend-design` to restate the intended direction and lock the style contract assumptions the audit will judge against.
2. Use `design` to identify the primary failure dimensions before proposing fixes.
3. Inspect the relevant screens or UI implementation.
4. Return prioritized findings with concrete remediation guidance and the corrected direction.

## Skill routing

- `frontend-design` for the public UI-design frame and intended direction
- `design` for critique taxonomy and route selection after diagnosis
- `web-ui-design`, `mobile-ui-design`, or `desktop-ui-design` for the remediation route once the audit identifies the failing surface

## Context notes

Provide screenshots, page routes, or component references and note whether the ask is critique-only or critique plus implementation.

## Verification

The result should prioritize specific issues rather than offering generic taste-based feedback.

## Output contract

```yaml
DESIGN_AUDIT_WORKFLOW_RESULT:
  corrected_direction: <2-5 word direction>
  findings:
    - severity: high | medium | low
      dimension: hierarchy | information_architecture | interaction_cost | consistency_drift | accessibility | motion_performance | component_boundary
      issue: <problem>
      fix: <recommended action>
  removals:
    - <what to remove or reject>
  strengths:
    - <what already works>
```

## Follow-up items

Typical next step: `/design-screen` or `/implement`

If command arguments are provided, treat them as additional user context.
'''
