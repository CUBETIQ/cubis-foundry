description = "Investigate a failure systematically, confirm the root cause, and verify the fix path."
prompt = '''
Execute the native projection of the /debug workflow.

Investigate a failure systematically, confirm the root cause, and verify the fix path.

Execution contract:
1. Treat route selection as already resolved by this command; do not begin with skill discovery.
- native workflow surface: command.
- native specialist surface: agent-route command.
2. Load docs in this order when they exist: `docs/foundation/MEMORY.md` -> `docs/foundation/memory/debugging.md` -> `docs/foundation/memory/runtime.md` -> `docs/foundation/memory/integrations.md` -> `docs/foundation/TECH.md`. Add `docs/foundation/ARCHITECTURE.md` when the failure crosses boundaries.
Attached skills:
- Load these exact skill IDs first: `systematic-debugging`, `web-testing`, `android-emulator-testing`, `ios-simulator-testing`.
- Local skill file hints if installed: `.agents/skills/systematic-debugging/SKILL.md`, `.agents/skills/web-testing/SKILL.md`, `.agents/skills/android-emulator-testing/SKILL.md`, `.agents/skills/ios-simulator-testing/SKILL.md`.
- Treat the skill bundle as already resolved for this workflow. Do not start with route discovery.
3. Confirm the request fits the workflow's "When to use" section before acting.
4. Execute according to "Workflow steps" and apply "Context notes".
5. Complete "Verification" checks and report concrete evidence.
6. If freshness, public comparison, or explicit research needs appear, pause implementation and load `deep-research` or route to research first.
7. For outside evidence: repo first, official docs next, Reddit/community only as labeled secondary evidence.
8. Keep runtime boundaries explicit: use Playwright MCP for web flows, prefer `mobile-mcp` for semantic mobile flows, and switch to CLI fallback when you need deterministic logs, build state, or replayable evidence.

Workflow source:
# Debug Workflow

## What this workflow does

Turns a vague failure report into a reproducible symptom, a confirmed cause, and a verified fix path.

## When to use

Use this when reproduction, diagnosis, and evidence matter more than immediately editing code.

## Agent chain

`debugger`

## Step details

1. Reproduce or precisely restate the failure.
2. Test hypotheses against evidence until the root cause is confirmed.
3. Propose or apply the fix and verify that the symptom is gone.

## Skill routing

- Always load `systematic-debugging`.
- Add the relevant domain skill only after the failure surface is known.
- Keep code-level unit and integration checks inside the owning language or framework skill.
- Use `web-testing`, `android-emulator-testing`, or `ios-simulator-testing` when the bug only proves out in a live browser or device runtime.

## Context notes

Provide the observed symptom, expected behavior, reproduction steps, and recent changes if known.

## Verification

The workflow is complete only when the root cause is explicit and the fix is validated against the original symptom.

## Output contract

```yaml
DEBUG_WORKFLOW_RESULT:
  symptom: <failure>
  root_cause: <cause>
  evidence:
    - <proof>
  verification: <fix confirmation>
```

## Follow-up items

Typical next step: `/implement` or `/test`

If command arguments are provided, treat them as additional user context.
'''
