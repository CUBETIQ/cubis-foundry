description = "Plan and implement delivery pipeline or runtime deployment changes with verification and rollback awareness."
prompt = '''
Execute the native projection of the /deploy workflow.

Plan and implement delivery pipeline or runtime deployment changes with verification and rollback awareness.

Execution contract:
1. Treat route selection as already resolved by this command; do not begin with skill discovery.
2. Read `docs/foundation/PRODUCT.md`, `ENGINEERING_RULES.md`, `docs/foundation/ARCHITECTURE.md`, and `docs/foundation/TECH.md` in that order when they exist before non-trivial execution.
Attached skills:
- Load these exact skill IDs first: `ci-cd-pipeline`, `kubernetes-deploy`, `observability`.
- Local skill file hints if installed: `.agents/skills/ci-cd-pipeline/SKILL.md`, `.agents/skills/kubernetes-deploy/SKILL.md`, `.agents/skills/observability/SKILL.md`.
- Treat the skill bundle as already resolved for this workflow. Do not start with route discovery.
3. Confirm the request fits the workflow's "When to use" section before acting.
4. Execute according to "Workflow steps" and apply "Context notes".
5. Complete "Verification" checks and report concrete evidence.
6. If freshness, public comparison, or explicit research needs appear, pause implementation and load `deep-research` or route to research first.
7. For outside evidence: repo first, official docs next, Reddit/community only as labeled secondary evidence.
8. Keep runtime boundaries explicit: use Playwright MCP for web flows, prefer `mobile-mcp` for semantic mobile flows, and switch to CLI fallback when you need deterministic logs, build state, or replayable evidence.

Workflow source:
# Deploy Workflow

## What this workflow does

Plans deployment-affecting changes, implements them carefully, and keeps verification and rollback paths explicit.

## When to use

Use this for CI/CD, environment, or release automation changes rather than application-only feature work.

## Agent chain

`planner -> implementer`

## Step details

1. Inspect the current pipeline or deployment surface.
2. Plan the required change, including rollback and observability checks.
3. Implement the update and run the highest-signal verification available.

## Skill routing

- `ci-cd-pipeline` for general delivery automation
- `kubernetes-deploy` when cluster resources are involved
- `observability` when rollout safety depends on telemetry

## Context notes

Provide the target environment, current deployment path, and any release or compliance constraints.

## Verification

The workflow is complete only when deployment impact, rollback posture, and validation steps are explicit.

## Output contract

```yaml
DEPLOY_WORKFLOW_RESULT:
  deployment_change: <summary>
  verification:
    - <check>
  rollback_plan: <summary>
  remaining_risks:
    - <risk>
```

## Follow-up items

Typical next step: `/review` or release execution outside the repo

If command arguments are provided, treat them as additional user context.
'''
