description = "Add or harden verification so the target behavior is covered by repeatable tests and focused checks."
prompt = '''
Execute the native projection of the /test workflow.

Add or harden verification so the target behavior is covered by repeatable tests and focused checks.

Execution contract:
1. Treat route selection as already resolved by this command; do not begin with skill discovery.
- native workflow surface: command.
- native specialist surface: agent-route command.
2. Load docs in this order when they exist: `docs/foundation/MEMORY.md` -> `docs/foundation/memory/debugging.md` -> `docs/foundation/memory/runtime.md` -> `docs/foundation/memory/integrations.md` -> `docs/foundation/TECH.md`. Add `docs/foundation/ARCHITECTURE.md` when the failure crosses boundaries.
Attached skills:
- Load these exact skill IDs first: `unit-testing`, `integration-testing`, `web-testing`, `android-emulator-testing`, `ios-simulator-testing`.
- Local skill file hints if installed: `.agents/skills/unit-testing/SKILL.md`, `.agents/skills/integration-testing/SKILL.md`, `.agents/skills/web-testing/SKILL.md`, `.agents/skills/android-emulator-testing/SKILL.md`, `.agents/skills/ios-simulator-testing/SKILL.md`.
- Treat the skill bundle as already resolved for this workflow. Do not start with route discovery.
3. Confirm the request fits the workflow's "When to use" section before acting.
4. Execute according to "Workflow steps" and apply "Context notes".
5. Complete "Verification" checks and report concrete evidence.
6. If freshness, public comparison, or explicit research needs appear, pause implementation and load `deep-research` or route to research first.
7. For outside evidence: repo first, official docs next, Reddit/community only as labeled secondary evidence.
8. Keep runtime boundaries explicit: use Playwright MCP for web flows, prefer `mobile-mcp` for semantic mobile flows, and switch to CLI fallback when you need deterministic logs, build state, or replayable evidence.

Workflow source:
# Test Workflow

## What this workflow does

Chooses the right test layer, adds or improves coverage, and records what behavior is now verified.

## When to use

Use this when the implementation exists but verification is weak, missing, or too manual.

## Agent chain

`tester`

## Step details

1. Identify the behavior that must be proven.
2. Add the narrowest useful tests or checks.
3. Run them and report both coverage added and remaining gaps.

## Skill routing

- Start with `unit-testing` for narrow code-level coverage and add `integration-testing` when the proof crosses a real boundary.
- Route browser QA to `web-testing`.
- Route Android emulator work to `android-emulator-testing`.
- Route iOS simulator work to `ios-simulator-testing`.
- Load the owning language or framework skill alongside these testing surfaces when the target stack has specific test conventions.

## Context notes

Provide the change summary, risk areas, and any known flaky or expensive checks.

## Verification

Completion requires executed evidence, not just proposed test ideas.

## Output contract

```yaml
TEST_WORKFLOW_RESULT:
  coverage_added:
    - <test>
  commands_run:
    - <command>
  remaining_gaps:
    - <gap>
```

## Follow-up items

Typical next step: `/review`

If command arguments are provided, treat them as additional user context.
'''
